[[lsp_servers]]
language_id = "bash"
command = "bash-language-server"
args = ["start"]
file_patterns = ["**/*.sh", "**/*.bash"]

[lsp_servers.heuristics]
project_markers = [".git"]

[[lsp_servers]]
language_id = "lua"
command = "lua-language-server"
file_patterns = ["**/*.lua"]

[lsp_servers.heuristics]
project_markers = [".luarc.json", "stylua.toml", ".stylua.toml", ".git"]

[[lsp_servers]]
language_id = "toml"
command = "taplo"
args = ["lsp", "stdio"]
file_patterns = ["**/*.toml"]

[lsp_servers.heuristics]
project_markers = [".taplo.toml", "taplo.toml", ".git"]

[[lsp_servers]]
language_id = "yaml"
command = "yaml-language-server"
args = ["--stdio"]
file_patterns = ["**/*.yaml", "**/*.yml"]

[lsp_servers.heuristics]
project_markers = [".git"]

[[lsp_servers]]
language_id = "json"
command = "vscode-json-language-server"
args = ["--stdio"]
file_patterns = ["**/*.json", "**/*.jsonc"]

[lsp_servers.heuristics]
project_markers = [".git"]

[[lsp_servers]]
language_id = "css"
command = "vscode-css-language-server"
args = ["--stdio"]
file_patterns = ["**/*.css", "**/*.scss", "**/*.less"]

[lsp_servers.heuristics]
project_markers = ["package.json", ".git"]

[[lsp_servers]]
language_id = "dockerfile"
command = "docker-langserver"
args = ["--stdio"]
file_patterns = ["**/Dockerfile*", "**/*.dockerfile"]

[lsp_servers.heuristics]
project_markers = ["Dockerfile", "compose.yaml", "docker-compose.yml"]

[[lsp_servers]]
language_id = "markdown"
command = "marksman"
args = ["server"]
file_patterns = ["**/*.md", "**/*.markdown"]

[lsp_servers.heuristics]
project_markers = [".git", ".marksman.toml"]

[[lsp_servers]]
language_id = "latex"
command = "texlab"
file_patterns = ["**/*.tex", "**/*.bib"]

[lsp_servers.heuristics]
project_markers = [".latexmkrc", "latexmkrc", ".texlabroot", "Tectonic.toml"]

[[lsp_servers]]
language_id = "nushell"
command = "nu"
args = ["--lsp"]
file_patterns = ["**/*.nu"]

[lsp_servers.heuristics]
project_markers = [".git"]
