# Language servers for MCP clients (Claude Code, Codex) via mcpls.
#
# Servers spawn only when a project_marker matches; missing binaries are
# skipped. One catch-all per language_id, or mcpls refuses to start.
# Commands resolve through PATH, so the Mason-installed servers need
# ~/.local/share/nvim/mason/bin on it.
#
# `roots` defaults to cwd, so launching a harness from $HOME scopes every
# tool call over ~/.ssh and ~/.aws.

[workspace]
heuristics_max_depth = 10
max_documents = 100
max_file_size = 10485760

[[workspace.language_extensions]]
extensions = ["nu"]
language_id = "nushell"

[[lsp_servers]]
language_id = "rust"
command = "rust-analyzer"
file_patterns = ["**/*.rs"]

[lsp_servers.heuristics]
project_markers = ["Cargo.toml", "rust-toolchain.toml"]

# Defaults compile and run build.rs and proc-macros from the open repo.
[lsp_servers.initialization_options]
cargo.buildScripts.enable = false
procMacro.enable = false

[[lsp_servers]]
language_id = "python"
command = "pyrefly"
args = ["lsp"]
file_patterns = ["**/*.py", "**/*.pyi"]

[lsp_servers.heuristics]
project_markers = ["pyrefly.toml", "pyproject.toml", "setup.py", "setup.cfg", "requirements.txt", "Pipfile"]

# tsgo shells out to `npm` for type acquisition whatever the package manager.
[[lsp_servers]]
language_id = "typescript"
command = "tsgo"
args = ["--lsp", "--stdio"]
file_patterns = ["**/*.ts", "**/*.tsx", "**/*.mts", "**/*.cts", "**/*.js", "**/*.jsx", "**/*.mjs", "**/*.cjs"]

[lsp_servers.heuristics]
project_markers = ["tsconfig.json", "jsconfig.json", "package.json"]

