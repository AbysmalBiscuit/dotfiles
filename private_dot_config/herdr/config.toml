onboarding = false
[ui]
show_agent_labels_on_pane_borders = true
host_cursor = "native"

[session]
resume_agents_on_restore = true

[theme]
name = "catppuccin-mocha"

# ABC colors from Neovim, layered over Catppuccin Mocha.
[theme.custom]
accent = "#308cc6"
panel_bg = "#18181b"
sidebar_bg = "#04070b"
active_row_bg = "#131b26"
selection_bg = "#343a48"
surface_dim = "#131b25"
overlay0 = "#6a6a6e"
overlay1 = "#7f7f7f"
text = "#e5e5e5"
blue = "#558eff"

[[keys.command]]
key = "ctrl+left"
type = "shell"
command = "python3 ~/.config/herdr/navigate.py left"
description = "Navigate left through Neovim and Herdr"

[[keys.command]]
key = "ctrl+down"
type = "shell"
command = "python3 ~/.config/herdr/navigate.py down"
description = "Navigate down through Neovim and Herdr"

[[keys.command]]
key = "ctrl+up"
type = "shell"
command = "python3 ~/.config/herdr/navigate.py up"
description = "Navigate up through Neovim and Herdr"

[[keys.command]]
key = "ctrl+right"
type = "shell"
command = "python3 ~/.config/herdr/navigate.py right"
description = "Navigate right through Neovim and Herdr"
