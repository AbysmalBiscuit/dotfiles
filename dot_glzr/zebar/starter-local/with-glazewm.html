<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Custom styles. -->
    <link rel="stylesheet" type="text/css" href="./styles.css" />

    <!-- Allows React to be run buildless via "text/babel" script below. -->
    <script
      src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js"
      integrity="sha256-aS0B0wnsaDByLfE16h4MDCP1fQFccysd1YWOcV+gbBo="
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
      import React, {
        useState,
        useEffect,
        useRef,
      } from 'https://esm.sh/react@18?dev';
      import { createRoot } from 'https://esm.sh/react-dom@18/client?dev';
      import * as zebar from 'https://esm.sh/zebar@3.0';

      const BATTERY_REFRESH_MS = 10000;

      // Tolerate a few dropped polls before distrusting the reading.
      const BATTERY_STALE_MS = BATTERY_REFRESH_MS * 4;

      const WATCHDOG_MS = 5000;

      // A watchdog tick arriving this late means the machine was
      // suspended rather than merely busy.
      const CLOCK_JUMP_MS = WATCHDOG_MS * 3;

      // Each restart re-acquires an OS battery handle, so back off
      // instead of retrying at watchdog speed.
      const BATTERY_RESTART_BACKOFF_MS = [15000, 60000, 300000];

      const providers = zebar.createProviderGroup({
        network: { type: 'network' },
        glazewm: { type: 'glazewm' },
        cpu: { type: 'cpu' },
        date: { type: 'date', formatting: 'EEE d MMM HH:mm' },
        battery: { type: 'battery', refreshInterval: BATTERY_REFRESH_MS },
        memory: { type: 'memory' },
        weather: { type: 'weather' },
      });

      createRoot(document.getElementById('root')).render(<App />);

      function App() {
        const [output, setOutput] = useState(providers.outputMap);

        // Keep the last good battery reading alongside when it arrived. A
        // failed poll nulls the provider's output-map entry, and the next
        // tick from any other provider pushes that null into state, so
        // without a cache the indicator unmounts on a single hiccup. The
        // timestamp is what keeps the cache honest: a reading that stops
        // being refreshed must not go on presenting itself as current.
        const [battery, setBattery] = useState(() => {
          const initial = providers.outputMap.battery;
          return initial ? { output: initial, at: Date.now() } : null;
        });

        const [batteryStale, setBatteryStale] = useState(false);

        const batteryAt = useRef(battery?.at ?? null);

        useEffect(() => {
          providers.onOutput(map => {
            setOutput(map);

            if (map.battery) {
              batteryAt.current = Date.now();
              setBattery({ output: map.battery, at: batteryAt.current });
              setBatteryStale(false);
            }
          });

          // Errors null the failing provider's entry without firing an
          // output event, so mirror the map here too — otherwise a dead
          // provider's last value stays on the bar indefinitely.
          providers.onError(() => setOutput(providers.outputMap));
        }, []);

        // The battery provider acquires its OS battery handle once and
        // then only refreshes through it. Across a suspend/resume cycle
        // that handle can stop yielding updates, stranding the readout at
        // whatever charge it last saw. Restarting the provider is what
        // re-acquires the handle; nothing else recovers it.
        useEffect(() => {
          let lastTick = Date.now();
          let attempt = 0;
          let nextRestartAt = 0;

          const watchdog = setInterval(() => {
            const now = Date.now();
            const resumed = now - lastTick > CLOCK_JUMP_MS;
            lastTick = now;

            // Never having seen a reading means there is nothing to
            // recover — a machine with no battery would restart forever.
            if (batteryAt.current === null) return;

            const stale = now - batteryAt.current > BATTERY_STALE_MS;
            setBatteryStale(stale);

            if (!stale && !resumed) {
              attempt = 0;
              nextRestartAt = 0;
              return;
            }

            if (resumed) {
              attempt = 0;
              nextRestartAt = 0;
            }

            if (now >= nextRestartAt) {
              providers.raw.battery.restart().catch(() => {});
              nextRestartAt =
                now +
                BATTERY_RESTART_BACKOFF_MS[
                  Math.min(attempt, BATTERY_RESTART_BACKOFF_MS.length - 1)
                ];
              attempt += 1;
            }
          }, WATCHDOG_MS);

          return () => clearInterval(watchdog);
        }, []);

        // Get icon to show for current network status.
        function getNetworkIcon(networkOutput) {
          switch (networkOutput.defaultInterface?.type) {
            case 'ethernet':
              return <i className="nf nf-md-ethernet_cable"></i>;
            case 'proprietary_virtual':
              return <i className="nf nf-md-shield_lock_outline"></i>;
            case 'wifi':
              if (networkOutput.defaultGateway?.signalStrength >= 80) {
                return <i className="nf nf-md-wifi_strength_4"></i>;
              } else if (
                networkOutput.defaultGateway?.signalStrength >= 65
              ) {
                return <i className="nf nf-md-wifi_strength_3"></i>;
              } else if (
                networkOutput.defaultGateway?.signalStrength >= 40
              ) {
                return <i className="nf nf-md-wifi_strength_2"></i>;
              } else if (
                networkOutput.defaultGateway?.signalStrength >= 25
              ) {
                return <i className="nf nf-md-wifi_strength_1"></i>;
              } else {
                return <i className="nf nf-md-wifi_strength_outline"></i>;
              }
            default:
              return (
                <i className="nf nf-md-wifi_strength_off_outline"></i>
              );
          }
        }

        // Get icon to show for how much of the battery is charged.
        function getBatteryIcon(batteryOutput) {
          if (batteryOutput.chargePercent > 90)
            return <i className="nf nf-fa-battery_4"></i>;
          if (batteryOutput.chargePercent > 70)
            return <i className="nf nf-fa-battery_3"></i>;
          if (batteryOutput.chargePercent > 40)
            return <i className="nf nf-fa-battery_2"></i>;
          if (batteryOutput.chargePercent > 20)
            return <i className="nf nf-fa-battery_1"></i>;
          return <i className="nf nf-fa-battery_0"></i>;
        }

        // Get class to color the battery by state and charge level.
        // Full and unknown stay neutral; only discharging tints by level.
        function getBatteryClass(batteryOutput) {
          if (batteryOutput.state === 'charging') return 'charging';
          if (batteryOutput.state === 'empty') return 'low';
          if (batteryOutput.state === 'discharging') {
            if (batteryOutput.chargePercent <= 20) return 'low';
            if (batteryOutput.chargePercent <= 40) return 'medium';
          }
          return '';
        }

        // Format milliseconds of runtime left as e.g. "1h 20m" or "45m".
        function formatTimeRemaining(ms) {
          const totalMinutes = Math.round(ms / 60000);
          const hours = Math.floor(totalMinutes / 60);
          const minutes = totalMinutes % 60;
          return hours > 0 ? `${hours}h ${minutes}m` : `${minutes}m`;
        }

        // Get icon to show for current weather status.
        function getWeatherIcon(weatherOutput) {
          switch (weatherOutput.status) {
            case 'clear_day':
              return <i className="nf nf-weather-day_sunny"></i>;
            case 'clear_night':
              return <i className="nf nf-weather-night_clear"></i>;
            case 'cloudy_day':
              return <i className="nf nf-weather-day_cloudy"></i>;
            case 'cloudy_night':
              return <i className="nf nf-weather-night_alt_cloudy"></i>;
            case 'light_rain_day':
              return <i className="nf nf-weather-day_sprinkle"></i>;
            case 'light_rain_night':
              return <i className="nf nf-weather-night_alt_sprinkle"></i>;
            case 'heavy_rain_day':
              return <i className="nf nf-weather-day_rain"></i>;
            case 'heavy_rain_night':
              return <i className="nf nf-weather-night_alt_rain"></i>;
            case 'snow_day':
              return <i className="nf nf-weather-day_snow"></i>;
            case 'snow_night':
              return <i className="nf nf-weather-night_alt_snow"></i>;
            case 'thunder_day':
              return <i className="nf nf-weather-day_lightning"></i>;
            case 'thunder_night':
              return <i className="nf nf-weather-night_alt_lightning"></i>;
          }
        }

        return (
          <div className="app">
            <div className="left">
              <i className="logo nf nf-fa-windows"></i>
              {output.glazewm && (
                <div className="workspaces">
                  {output.glazewm.currentWorkspaces.map(workspace => (
                    <button
                      className={`workspace ${workspace.hasFocus && 'focused'} ${workspace.isDisplayed && 'displayed'}`}
                      onClick={() =>
                        output.glazewm.runCommand(
                          `focus --workspace ${workspace.name}`,
                        )
                      }
                      key={workspace.name}
                    >
                      {workspace.displayName ?? workspace.name}
                    </button>
                  ))}
                </div>
              )}
            </div>

            <div className="center">{output.date?.formatted}</div>

            <div className="right">
              {output.glazewm && (
                <>
                  {output.glazewm.isPaused && (
                    <button
                      className="paused-button"
                      onClick={() =>
                        output.glazewm.runCommand('wm-toggle-pause')
                      }
                    >
                      PAUSED
                    </button>
                  )}
                  {output.glazewm.bindingModes.map(bindingMode => (
                    <button
                      className="binding-mode"
                      key={bindingMode.name}
                      onClick={() =>
                        output.glazewm.runCommand(
                          `wm-disable-binding-mode --name ${bindingMode.name}`,
                        )
                      }
                    >
                      {bindingMode.displayName ?? bindingMode.name}
                    </button>
                  ))}

                  <button
                    className={`tiling-direction nf ${
                      output.glazewm.tilingDirection === 'horizontal'
                        ? 'nf-md-swap_horizontal'
                        : 'nf-md-swap_vertical'
                    }`}
                    onClick={() =>
                      output.glazewm.runCommand('toggle-tiling-direction')
                    }
                  ></button>
                </>
              )}

              {output.network && (
                <div className="network">
                  {getNetworkIcon(output.network)}
                  {output.network.defaultGateway?.ssid}
                </div>
              )}

              {output.cpu && (
                <div className="cpu">
                  <i className="nf nf-oct-cpu"></i>

                  {/* Change the text color if the CPU usage is high. */}
                  <span
                    className={output.cpu.usage > 85 ? 'high-usage' : ''}
                  >
                    {Math.round(output.cpu.usage)}%
                  </span>
                </div>
              )}

              {output.memory && (
                <div className="memory">
                  <i className="nf nf-fae-chip"></i>
                  {Math.round(output.memory.usage)}%
                </div>
              )}

              {battery && (
                <div
                  className={`battery ${getBatteryClass(battery.output)} ${
                    batteryStale ? 'stale' : ''
                  }`}
                >
                  {/* Show a plug when on power: charging or topped off. */}
                  {(battery.output.state === 'charging' ||
                    battery.output.state === 'full') && (
                    <i className="nf nf-md-power_plug charging-icon"></i>
                  )}
                  {getBatteryIcon(battery.output)}
                  {Math.round(battery.output.chargePercent)}%
                  {/* Mark the number as no-longer-current rather than
                      letting it pass for a live reading. */}
                  {batteryStale && (
                    <i className="nf nf-md-alert_outline stale-icon"></i>
                  )}
                </div>
              )}

              {/* Time estimate in its own slot, labeled by a battery
                  icon (empty = time left, full = time to full) so it
                  stays short on narrow/vertical screens. Estimates from a
                  stale reading are meaningless, so drop them. */}
              {!batteryStale && battery?.output.timeTillEmpty != null && (
                <div className="battery-time">
                  {formatTimeRemaining(battery.output.timeTillEmpty)}
                  <i className="nf nf-md-battery_outline"></i>
                </div>
              )}
              {!batteryStale && battery?.output.timeTillFull != null && (
                <div className="battery-time-full">
                  {formatTimeRemaining(battery.output.timeTillFull)}
                  <i className="nf nf-md-battery"></i>
                </div>
              )}

              {output.weather && (
                <div className="weather">
                  {getWeatherIcon(output.weather)}
                  {Math.round(output.weather.celsiusTemp)}°C
                </div>
              )}
            </div>
          </div>
        );
      }
    </script>
  </body>
</html>
