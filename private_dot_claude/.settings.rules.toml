#:schema ../.agentcfg/schema/agentcfg-rules-claude.json
# Maps settings.json keys to a merge strategy. The schema above documents each
# strategy; see .agentcfg/engine/merge.py for the merge itself.

enforce = [
  ["permissions", "deny"],
  ["permissions", "defaultMode"],
  ["hooks", "*"],
  ["env", "*"],
  ["statusLine"],
  ["extraKnownMarketplaces", "*"],
  ["$schema"],
  ["attribution"],
  ["fileSuggestion"],
  ["cleanupPeriodDays"],
]
union = [
  ["permissions", "allow"],
]
seed = [
  ["model"], ["theme"], ["outputStyle"], ["editorMode"], ["effortLevel"],
  ["enabledPlugins", "*"],
  ["autoMemoryEnabled"], ["skipWorkflowUsageWarning"], ["teammateMode"],
  ["agentPushNotifEnabled"], ["remoteControlAtStartup"],
  ["tui"], ["voice"], ["prefersReducedMotion"],
]
ignore = [
  ["feedbackSurveyRate"],
  ["companyAnnouncements"],
  ["env", "TEMP"], ["env", "TMP"],
]
# agent-guard takes its log level from its own config.toml. An env var here
# would outrank that file on Claude alone, which is how the two drift apart.
remove = [
  ["env", "AGENT_GUARD_LOG"],
]
