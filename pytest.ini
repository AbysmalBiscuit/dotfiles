[pytest]
# A test lives beside the file it covers, as NAME.test.py. That is not one of
# pytest's default patterns, and the dot is not a legal module name, so the
# importlib import mode is what makes these files loadable at all.
python_files = test_*.py *.test.py
testpaths = tests private_dot_config/herdr
# navigate.test.py is an interactive pty harness rather than a pytest module: it
# drives a live herdr and Neovim, and exits at import when either is missing.
addopts = --ignore=private_dot_config/herdr/navigate.test.py --import-mode=importlib
