<div id="lightbox" role="dialog" aria-modal="true" aria-label="Enlarged diagram">
  <div class="lb-bar">
    <span class="lb-cap" id="lb-caption"></span>
    <span class="lb-tools">
      <button type="button" data-z="out" aria-label="Zoom out">−</button>
      <span class="lb-pct" id="lb-pct">100%</span>
      <button type="button" data-z="in" aria-label="Zoom in">+</button>
      <button type="button" data-z="fit">Fit</button>
      <button type="button" data-z="full">100%</button>
      <button class="lb-close" type="button">✕ Close</button>
    </span>
  </div>
  <div class="lb-stage"><div class="lb-pan"></div></div>
  <div class="lb-foot"></div>
  <p class="lb-hint">scroll to zoom · drag to pan · double-click to zoom in · <kbd>+</kbd> <kbd>−</kbd> <kbd>0</kbd> fit · <kbd>Esc</kbd> close</p>
</div>
