id: hardcoded-uuid-typescript
language: typescript
severity: error
message: "hardcoded UUID; add it to packages/core/src/constants.ts and import via constants"
files:
  - "**/*.ts"
  - "**/*.tsx"
ignores:
  - "**/constants.ts"
  - "**/*.test.ts"
  - "**/*.test.tsx"
  - "**/*.spec.ts"
  - "**/__tests__/**"
  - "**/*.gen.ts"
  - "**/db-types/**"
  - "**/api-client/**"
  - "**/modal-clients/**"
  - "**/supabase/migrations/**"
rule:
  kind: string_fragment
  regex: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
