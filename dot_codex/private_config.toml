#:schema https://developers.openai.com/codex/config-schema.json
approvals_reviewer = "auto_review"
model = "gpt-5.6-sol"
model_reasoning_effort = "xhigh"

[features]
experimental_use_rmcp_client = true

[projects]

[marketplaces]

[marketplaces.devkit]
last_updated = ""
last_revision = ""
source_type = "git"
source = "https://github.com/AbysmalBiscuit/devkit.git"

[plugins]

[plugins."devkit@devkit"]
enabled = true

[plugins."sentry@openai-curated"]
enabled = true

[plugins."slack@openai-curated"]
enabled = true

[plugins."linear@openai-curated"]
enabled = true

[plugins."posthog@openai-curated"]
enabled = true

[plugins."claude-custom@personal"]
enabled = true

[hooks]

[hooks.state]

[mcp_servers]

[mcp_servers.adaptyv_bio_mcp]
url = "https://mcp.adaptyv.bio/mcp"

[tui]
status_line = [
    "model-with-reasoning",
    "project-name",
    "git-branch",
    "pull-request-number",
    "run-state",
    "approval-mode",
    "context-used",
    "five-hour-limit",
    "weekly-limit",
    "current-dir",
]
status_line_use_colors = true
vim_mode_default = true

[tui.model_availability_nux]
"gpt-5.5" = 1
"gpt-5.6-sol" = 2
