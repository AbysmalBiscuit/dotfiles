approvals_reviewer = "auto_review"
model = "gpt-5.6-sol"
model_reasoning_effort = "xhigh"

[marketplaces.devkit]
source_type = "git"
source = "https://github.com/AbysmalBiscuit/devkit.git"

[plugins."devkit@devkit"]
enabled = true

[plugins."sentry@openai-curated"]
enabled = true

[plugins."slack@openai-curated"]
enabled = true

[plugins."linear@openai-curated"]
enabled = true

[plugins."posthog@openai-curated"]
enabled = true

[plugins."claude-custom@personal"]
enabled = true

[plugins."superpowers@openai-curated"]
enabled = true

[plugins."superpowers@personal"]
enabled = true

[hooks.state]

# mcp servers

[mcp_servers.adaptyv_bio_mcp]
url = "https://mcp.adaptyv.bio/mcp"

[tui]
status_line = [
    "model-with-reasoning",
    "current-dir",
    "project-name",
    "git-branch",
    "pull-request-number",
    "run-state",
    "approval-mode",
    "context-used",
    "five-hour-limit",
    "weekly-limit",
]
status_line_use_colors = true

[tui.model_availability_nux]
"gpt-5.5" = 1
"gpt-5.6-sol" = 2
