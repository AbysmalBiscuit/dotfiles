#:schema https://developers.openai.com/codex/config-schema.json
# vim: shiftwidth=4 tabstop=4 expandtab
approvals_reviewer = "auto_review"
model = "gpt-5.6-astra"
model_reasoning_effort = "medium"

[features]
experimental_use_rmcp_client = true
hooks = true

[hooks]
[[hooks.PostToolUse]]
matcher = "^apply_patch$"
hooks = [
    {
        type = "command",
        command = "python3 ~/.agents/plugins/agent-guard/scripts/agent_guard.py --codex",
        command_windows = '~\.local\bin\python3.exe ~\.agents\plugins\agent-guard\scripts\agent_guard.py --codex',
        timeout = 10,
        statusMessage = "Checking conventions",
    },
]

[[hooks.PostToolUse]]
matcher = "^(Bash|exec_command|shell_command|shell)$"

[[hooks.PostToolUse.hooks]]
type = "command"
command = "python3 ~/.agents/plugins/agent-guard/scripts/shell_calls.py --harness codex"
command_windows = "~\\.local\\bin\\python3.exe ~\\.agents\\plugins\\agent-guard\\scripts\\shell_calls.py --harness codex"
timeout = 3
[[hooks.PreToolUse]]
matcher = "^(Bash|exec_command|shell_command|shell)$"
hooks = [
    {
        type = "command",
        command = "python3 ~/.agents/plugins/agent-guard/scripts/agent_guard.py --codex",
        command_windows = '~\.local\bin\python3.exe ~\.agents\plugins\agent-guard\scripts\agent_guard.py --codex',
        timeout = 8,
        statusMessage = "Checking tool conventions",
    },
]

[[hooks.PreToolUse]]
matcher = "^(Bash|exec_command|shell_command|shell)$"

[[hooks.PreToolUse.hooks]]
type = "command"
command = "python3 ~/.agents/plugins/agent-guard/scripts/shell_calls.py --harness codex"
command_windows = "~\\.local\\bin\\python3.exe ~\\.agents\\plugins\\agent-guard\\scripts\\shell_calls.py --harness codex"
timeout = 3
[[hooks.SessionEnd]]
hooks = [
    {
        type = "command",
        command = "python3 ~/.agents/skills/history/hist.py index",
        command_windows = 'C:\Users\Lev\.local\bin\python3.exe C:\Users\Lev\.agents\skills\history\hist.py index',
        timeout = 3,
    },
]

[[hooks.SessionStart]]
hooks = [
    {
        type = "command",
        command = "bash '/home/lev/.codex/herdr-agent-state.sh' session",
        command_windows = 'powershell -NoProfile -ExecutionPolicy Bypass -File "C:\Users\Lev\.codex\herdr-agent-state.ps1" session',
        timeout = 10,
    },
    {
        type = "command",
        command = "python3 ~/.agents/scripts/alacritree-follow.py",
        command_windows = 'C:\Users\Lev\.local\bin\python3.exe C:\Users\Lev\.agents\scripts\alacritree-follow.py',
        timeout = 30,
    },
]

[[hooks.Stop]]
hooks = [
    {
        type = "command",
        command = "python3 ~/.agents/plugins/agent-guard/scripts/agent_guard.py --codex",
        command_windows = '~\.local\bin\python3.exe ~\.agents\plugins\agent-guard\scripts\agent_guard.py --codex',
        timeout = 60,
        statusMessage = "Auditing changeset",
    },
]

[[hooks.SubagentStop]]
hooks = [
    {
        type = "command",
        command = "python3 ~/.agents/plugins/agent-guard/scripts/agent_guard.py --codex",
        command_windows = '~\.local\bin\python3.exe ~\.agents\plugins\agent-guard\scripts\agent_guard.py --codex',
        timeout = 60,
        statusMessage = "Auditing changeset",
    },
]

[[hooks.UserPromptSubmit]]
hooks = [
    {
        type = "command",
        command = "python3 ~/.agents/scripts/alacritree-follow.py",
        command_windows = 'C:\Users\Lev\.local\bin\python3.exe C:\Users\Lev\.agents\scripts\alacritree-follow.py',
        timeout = 30,
    },
]

[marketplaces.devkit]
source = "https://github.com/AbysmalBiscuit/devkit.git"
source_type = "git"

[marketplaces.superpowers-marketplace]
source = "https://github.com/obra/superpowers-marketplace.git"
source_type = "git"

[mcp_servers.adaptyv_bio_mcp]
url = "https://mcp.adaptyv.bio/mcp"

[plugins."devkit@devkit"]
enabled = true

[plugins."linear@openai-curated"]
enabled = false

[plugins."posthog@openai-curated"]
enabled = false

[plugins."sentry@openai-curated"]
enabled = false

[plugins."slack@openai-curated"]
enabled = false

[plugins."superpowers@superpowers-marketplace"]
enabled = true

[tui]
theme = "abc"
status_line = [
    "model-with-reasoning",
    "project-name",
    "git-branch",
    "pull-request-number",
    "run-state",
    "approval-mode",
    "context-used",
    "five-hour-limit",
    "weekly-limit",
    "current-dir",
]
status_line_use_colors = true
vim_mode_default = true

[tui.keymap.editor]
delete_backward_word = ["ctrl-backspace", "ctrl-w"]
delete_forward_word = "ctrl-delete"

[tui.keymap.global]
open_agents = "ctrl-\\"
